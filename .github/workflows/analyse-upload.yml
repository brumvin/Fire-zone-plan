name: Analyse uploaded floor plan

on:
  push:
    paths:
      - "uploads/**.png"
      - "uploads/**.jpg"
      - "uploads/**.jpeg"
      - "uploads/**.webp"
  workflow_dispatch:
    inputs:
      image_path:
        description: "Path to an image already in uploads/"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Find uploaded image
        id: image
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.image_path }}" ]; then
            FILE="${{ github.event.inputs.image_path }}"
          else
            FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Ei '^uploads/.*\.(png|jpe?g|webp)$' | tail -1)"
          fi
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "No uploaded image found"
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Analyse drawing with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/analyse-upload.mjs "${{ steps.image.outputs.file }}"

      - name: Commit AI result
        shell: bash
        run: |
          git config user.name "fire-zone-ai[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest.json results/history/
          git commit -m "AI analyse floor plan [skip ci]" || exit 0
          git push
